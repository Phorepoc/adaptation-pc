# Embedded in grubx64.efi (build_ipxe.sh): the ISO's grub.cfg with the kernel fetched over HTTP. @LAB@ = host[:port].
set timeout=0
insmod efi_gop
insmod efinet
insmod http
net_bootp
menuentry "Phorepoc x86_64 (netboot)" {
    multiboot2 (http,@LAB@)/gpd/phorepoc.elf
    boot
}
