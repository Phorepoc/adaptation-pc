# variant.yml -- a test variant of the PC image, run by hand: the same build as release.yml (the pdk's reusable
# workflow, the commits board.lock pins) with KEY=VALUE pairs set for the image build, e.g. "SSM_TEST=jrtprobe" for a ROM that
# starts that boot test. Never released: the files are this run's artifact (phorepoc-pc).
name: variant

on:
  workflow_dispatch:
    inputs:
      build_env:
        description: "KEY=VALUE pairs for the image build (e.g. SSM_TEST=jrtprobe)"
        required: true
        type: string

concurrency:
  group: variant-phevbox
  cancel-in-progress: false

jobs:
  image:
    uses: Phorepoc/pdk/.github/workflows/board-image.yml@main
    with:
      build_env: ${{ inputs.build_env }}
    permissions:
      contents: write
      packages: write
