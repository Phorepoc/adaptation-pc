# release.yml -- the PC image: a bootable ISO and a VirtualBox appliance (.ova), built by the pdk's reusable workflow
# from the commits board.lock pins. A tag v* publishes them as a draft release of this repository (review, then
# publish); a manual run only uploads them as workflow artifacts.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    uses: Phorepoc/pdk/.github/workflows/board-image.yml@main
    with:
      board: pc
      release: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
      packages: read
